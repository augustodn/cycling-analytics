[project]
name = "strava-analysis"
version = "0.1.0"
description = "Local tools for downloading and analyzing Strava activity files"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fitdecode>=0.11,<0.12",
    "pyarrow>=20,<24",
    "pydantic>=2.11,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "psycopg[binary]>=3.2,<4",
    "vercel==0.11.4",
    "pyjwt>=2.10,<3",
    "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]
local = [
    "playwright>=1.50,<2",
    "duckdb>=1.4,<2",
    "streamlit>=1.45,<2",
    "plotly>=6,<7",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]


[tool.uv]
package = false
default-groups = ["dev", "local"]
